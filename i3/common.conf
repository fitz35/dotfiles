# Part of the i3 config shared with sway (same syntax) : included by i3/config and sway/config.
# They set before the include : $mod, $my_script, $term (terminal), $wm_msg (i3-msg / swaymsg),
# $screens_conf (workspaces of each screen, generated by screen_management.py) and $i3_config_folder.
# The variables defined here ($ws1...) are only visible in this file and the ones it includes.

# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
font pango:monospace 8

# Use pactl to adjust volume in PulseAudio.
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# start a terminal
bindsym $mod+Return exec $term
bindsym Control+Mod1+t exec warp-terminal
bindsym Control+Mod1+y exec gnome-terminal

# open the code menu
bindsym $mod+Mod1+t exec $my_script github_menu terminal
bindsym $mod+t exec $my_script github_menu zed
bindsym $mod+Shift+t exec $my_script github_menu code



# logout menu (nedd the script used in the plybar)
bindsym $mod+Escape exec $my_script logout_menu

bindsym $mod+w exec $my_script vpn_menu

# the power button must be captured in logind (see the doc)
bindsym --release XF86PowerOff exec $my_script logout_menu

# start the program launcher
bindsym $mod+d exec $my_script rofi -show drun


# start dmenu (a program launcher)
# notifications (dunst) : close the last one, show the previous ones again
bindsym $mod+n exec --no-startup-id dunstctl close
bindsym $mod+Shift+n exec --no-startup-id dunstctl history-pop

# greenclip
bindsym $mod+v exec --no-startup-id "$my_script clipboard"

# ------------------------------------------------ window management ------------------------------------------------


# change focus
bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+l focus up
bindsym $mod+m focus right

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+M move right

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# split in horizontal orientation
bindsym $mod+h split h

# split in vertical orientation
bindsym $mod+Shift+v split v

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+z layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle

# focus the parent container
bindsym $mod+q focus parent

# kill focused window
bindsym $mod+Shift+A kill

# focus the child container
#bindsym $mod+d focus child

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
set $ws1 "1:"
set $ws2 "2:"
set $ws3 "3:"
set $ws4 "4:󱓧"
set $ws5 "5"
set $ws6 "6:"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9:"
set $ws10 "10"
set $ws11 "11:"
set $ws12 "12"
set $ws13 "13"
set $ws14 "14"
set $ws15 "15"
set $ws16 "16"
set $ws17 "17"
set $ws18 "18"
set $ws19 "19"
set $ws20 "20"

# assign the workspaces to the screens : $screens_conf (generated by screen_management.py) defines
# $screen_1 (main), $screen_2 and $screen_3, then includes workspaces.conf (the variables of an
# included file aren't visible here, so the rules using them are in workspaces.conf)
include $screens_conf


# switch to workspace
bindsym $mod+ampersand workspace number $ws1
bindsym $mod+eacute workspace number $ws2
bindsym $mod+quotedbl workspace number $ws3
bindsym $mod+apostrophe workspace number $ws4
bindsym $mod+parenleft workspace number $ws5
bindsym $mod+minus workspace number $ws6
bindsym $mod+egrave workspace number $ws7
bindsym $mod+underscore workspace number $ws8
bindsym $mod+ccedilla workspace number $ws9
bindsym $mod+agrave workspace number $ws10

bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+eacute move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+egrave move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+ccedilla move container to workspace number $ws9
bindsym $mod+Shift+agrave move container to workspace number $ws10


 # switch to workspace
bindsym $mod+F1 workspace number $ws11
bindsym $mod+F2 workspace number $ws12
bindsym $mod+F3 workspace number $ws13
bindsym $mod+F4 workspace number $ws14
bindsym $mod+F5 workspace number $ws15
bindsym $mod+F6 workspace number $ws16
bindsym $mod+F7 workspace number $ws17
bindsym $mod+F8 workspace number $ws18
bindsym $mod+F9 workspace number $ws19
bindsym $mod+F10 workspace number $ws20

# move focused container to workspace
bindsym $mod+Shift+F1 move container to workspace number $ws11
bindsym $mod+Shift+F2 move container to workspace number $ws12
bindsym $mod+Shift+F3 move container to workspace number $ws13
bindsym $mod+Shift+F4 move container to workspace number $ws14
bindsym $mod+Shift+F5 move container to workspace number $ws15
bindsym $mod+Shift+F6 move container to workspace number $ws16
bindsym $mod+Shift+F7 move container to workspace number $ws17
bindsym $mod+Shift+F8 move container to workspace number $ws18
bindsym $mod+Shift+F9 move container to workspace number $ws19
bindsym $mod+Shift+F10 move container to workspace number $ws20

# move workspace to screen (the ones to a given screen are in workspaces.conf)
bindsym $mod+Mod1+4 move workspace to output next

# rolling :
bindsym $mod+Tab workspace next_on_output
bindsym $mod+shift+Tab workspace prev_on_output
#bindsym $mod+Tab workspace next
#bindsym $mod+Shift+Tab workspace prev

# workpace assigned
# to identify the class of the window : xprop 
# then click on the window
assign [class="Thunderbird"] $ws1
assign [class="(?i)firefox"] $ws2
assign [class="obsidian"] $ws4
assign [class="discord"] $ws5
assign [class="warp"] $ws6
assign [class="stacer"] $ws10
assign [class="Spotify"] $ws11
# cant put code (multiple windows)
# assign the vscode of the config to the workspace 9 (add - Visual Studio Code to the title to apply the rule only 
# when the window is load)
# exclude pop up by title
for_window [class="(?i)code" title=".* - Visual Studio Code"] move container to workspace $ws3
for_window [class="obsidian" title=".*notes*."] move container to workspace $ws4
for_window [class="(?i)code" title=".*dotfiles - Visual Studio Code"] move container to workspace $ws9
# open the connection applet
bindsym $mod+Shift+w exec nm-connection-editor
# resize window (you can also use the mouse for that)
mode "resize" {
        # These bindings trigger as soon as you enter the resize mode

        # Pressing left will shrink the window’s width.
        # Pressing right will grow the window’s width.
        # Pressing up will shrink the window’s height.
        # Pressing down will grow the window’s height.
        bindsym j resize shrink width 10 px or 10 ppt
        bindsym k resize grow height 10 px or 10 ppt
        bindsym l resize shrink height 10 px or 10 ppt
        bindsym m resize grow width 10 px or 10 ppt

        # same bindings, but for the arrow keys
        bindsym Left resize shrink width 10 px or 10 ppt
        bindsym Down resize grow height 10 px or 10 ppt
        bindsym Up resize shrink height 10 px or 10 ppt
        bindsym Right resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}


bindsym $mod+r mode "resize"

# class                 border  bground text    indicator child_border
client.focused          #83CAFA #51A2DA #FFFFFF #83CAFA   #51A2DA
client.focused_inactive #8C8C8C #4C4C4C #FFFFFF #4C4C4C   #8C8C8C
client.unfocused        #4C4C4C #222222 #888888 #292D2E   #222222
client.urgent           #EC69A0 #DB3279 #FFFFFF #DB3279   #DB3279
client.placeholder      #000000 #0C0C0C #FFFFFF #000000   #0C0C0C

client.background       #FFFFFF

# wallpaper (exec_always : a sway reload clears the background, the restarted loop sets one at once)
exec_always --no-startup-id $my_script wallpaper

# start the application
# --no-startup-id : don't wait for the application to finish to start
# thunderbird launch error message at load because of the connection 
# to internet isnt load totaly....delay it to avoid this (and last to be executed last)
# NOTE : discord must in first, else it will swallow the firefox window for 
# whatever reason
exec $wm_msg "workspace $ws5; exec discord"
exec $wm_msg "workspace $ws4; exec obsidian ~/Documents/github/perso-divers/notes"
exec $wm_msg "workspace $ws6; exec warp-terminal"
exec $wm_msg "workspace $ws9; exec code ~/Documents/github/dotfiles/"
exec $wm_msg "workspace $ws10; exec stacer"
exec $wm_msg "workspace $ws11; exec spotify"
exec $wm_msg "workspace $ws2; exec firefox"
exec $wm_msg "workspace $ws1; exec sleep 2 && thunderbird"
