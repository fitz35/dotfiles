# workspace rules using the screens (included by the generated screens.conf, see the main config)
# a workspace goes on the first connected screen of its list ($screen_2 and $screen_3 fall back on
# the main screen when missing)

# assign the workspace to the screen
workspace $ws1 output $screen_2 $screen_1
workspace $ws2 output $screen_2 $screen_1
workspace $ws3 output $screen_1
workspace $ws4 output $screen_1
workspace $ws5 output $screen_2 $screen_1
workspace $ws6 output $screen_1
workspace $ws7 output $screen_1
workspace $ws8 output $screen_1
workspace $ws9 output $screen_1
workspace $ws10 output $screen_2 $screen_1
workspace $ws11 output $screen_2 $screen_1
workspace $ws12 output $screen_1
workspace $ws13 output $screen_1
workspace $ws14 output $screen_1
workspace $ws15 output $screen_1
workspace $ws16 output $screen_3 $screen_1
workspace $ws17 output $screen_3 $screen_1
workspace $ws18 output $screen_3 $screen_1
workspace $ws19 output $screen_3 $screen_1
workspace $ws20 output $screen_3 $screen_1

# move workspace to screen
bindsym $mod+Mod1+1 move workspace to output $screen_2
bindsym $mod+Mod1+eacute move workspace to output $screen_1
bindsym $mod+Mod1+3 move workspace to output $screen_3
